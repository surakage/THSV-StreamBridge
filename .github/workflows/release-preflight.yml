name: Release preflight

on:
  schedule:
    - cron: '17 10 * * 1'
  workflow_dispatch:
    inputs:
      current-tag:
        description: Candidate tag (defaults to v plus package.json version)
        required: false
        type: string
      previous-tag:
        description: Verified release to exercise as the upgrade source (auto-detected when empty)
        required: false
        type: string
  workflow_call:
    inputs:
      current-tag:
        required: false
        type: string
      previous-tag:
        required: false
        type: string

concurrency:
  group: release-preflight-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  attestations: read
  actions: read
  issues: write

jobs:
  candidate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Restore checksum-verified portable Node runtime cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .cache/node-runtime
          key: portable-node-runtime-${{ runner.os }}-22.23.1-preflight-${{ hashFiles('scripts/package-release.ps1') }}
          restore-keys: |
            portable-node-runtime-${{ runner.os }}-22.23.1-
      - name: Run startup-chaos acceptance
        shell: powershell
        run: npm run test:startup-chaos
      - name: Run the same package, install, repair, and upgrade gate used by tag publication
        env:
          GH_TOKEN: ${{ github.token }}
          PREFLIGHT_EVENT_NAME: ${{ github.event_name }}
        shell: powershell
        run: |
          $arguments = @()
          if ($env:PREFLIGHT_EVENT_NAME -eq 'schedule') { $arguments += '-AllowPublishedCurrentVersion' }
          .\scripts\test-release-candidate.ps1 -CurrentTag '${{ inputs.current-tag }}' -PreviousTag '${{ inputs.previous-tag }}' @arguments
      - name: Upload preflight evidence and candidate packages
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-preflight-${{ github.run_id }}
          path: |
            artifacts/startup-chaos/latest.json
            artifacts/release-lifecycle/latest.json
            packages/THSV-StreamBridge-*.zip
            packages/THSV-StreamBridge-*.sha256
            packages/THSV-StreamBridge-AddOns-index.json
          if-no-files-found: warn
          retention-days: 14

  acl-acceptance:
    needs: candidate
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out ACL acceptance test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download candidate package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-preflight-${{ github.run_id }}
          path: candidate
      - name: Enforce and inspect real Windows ACLs
        shell: powershell
        run: |
          $archive = Get-ChildItem candidate -Recurse -Filter 'THSV-StreamBridge-*.zip' | Where-Object { $_.Name -notlike 'THSV-StreamBridge-AddOn-*' } | Select-Object -First 1
          if ($null -eq $archive) { throw 'Candidate archive was not available for ACL acceptance.' }
          .\tests\windows\installer-acl.tests.ps1 -ArchivePath $archive.FullName

  notify-after-repeat-failure:
    needs: [candidate, acl-acceptance]
    if: ${{ always() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out notification policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Notify only after two consecutive scheduled failures
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RESULT: ${{ needs.candidate.result == 'success' && needs.acl-acceptance.result == 'success' && 'success' || 'failure' }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/manage-automation-issue.mjs --kind release-preflight --result "$CURRENT_RESULT" --repository "$REPOSITORY" --run-url "$RUN_URL"
