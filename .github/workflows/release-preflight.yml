name: Release preflight

on:
  schedule:
    - cron: '17 10 * * 1'
  workflow_dispatch:
    inputs:
      current-tag:
        description: Candidate tag (defaults to v plus package.json version)
        required: false
        type: string
      previous-tag:
        description: Verified release to exercise as the upgrade source (auto-detected when empty)
        required: false
        type: string
  workflow_call:
    inputs:
      current-tag:
        required: false
        type: string
      previous-tag:
        required: false
        type: string

concurrency:
  group: release-preflight-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  attestations: read
  actions: read
  issues: write

jobs:
  candidate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out candidate source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run startup-chaos acceptance
        shell: powershell
        run: npm run test:startup-chaos
      - name: Run the same package, install, repair, and upgrade gate used by tag publication
        env:
          GH_TOKEN: ${{ github.token }}
          PREFLIGHT_EVENT_NAME: ${{ github.event_name }}
        shell: powershell
        run: |
          $arguments = @()
          if ($env:PREFLIGHT_EVENT_NAME -eq 'schedule') { $arguments += '-AllowPublishedCurrentVersion' }
          .\scripts\test-release-candidate.ps1 -CurrentTag '${{ inputs.current-tag }}' -PreviousTag '${{ inputs.previous-tag }}' @arguments
      - name: Upload preflight evidence and candidate packages
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-preflight-${{ github.run_id }}
          path: |
            artifacts/startup-chaos/latest.json
            artifacts/release-lifecycle/latest.json
            packages/THSV-StreamBridge-*.zip
            packages/THSV-StreamBridge-*.sha256
            packages/THSV-StreamBridge-AddOns-index.json
          if-no-files-found: warn
          retention-days: 14

  notify-after-repeat-failure:
    needs: candidate
    if: ${{ always() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - name: Notify only after two consecutive scheduled failures
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RESULT: ${{ needs.candidate.result }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          title='[automation] Release preflight has failed twice'
          open_issue=$(gh issue list --repo "$REPOSITORY" --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [[ "$CURRENT_RESULT" == 'success' ]]; then
            if [[ -n "$open_issue" ]]; then
              gh issue close "$open_issue" --repo "$REPOSITORY" --comment "The weekly non-publishing release preflight recovered successfully: $RUN_URL"
            fi
            exit 0
          fi
          previous=$(gh run list --repo "$REPOSITORY" --workflow release-preflight.yml --event schedule --status completed --limit 1 --json conclusion --jq '.[0].conclusion // empty')
          if [[ "$previous" != 'failure' || -n "$open_issue" ]]; then exit 0; fi
          gh issue create --repo "$REPOSITORY" --title "$title" --body "Two consecutive weekly non-publishing release preflights failed. Review the latest run: $RUN_URL"
