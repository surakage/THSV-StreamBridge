name: Windows signing certificate preflight reminder

on:
  schedule:
    - cron: '17 13 1 * *'
  workflow_dispatch:

concurrency:
  group: windows-signing-certificate-reminder
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  inspect-freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check for a protected signing-mode preflight within the monthly evidence window
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-signing-preflight-freshness.mjs --repository "${{ github.repository }}" --maximum-age-days 35 --github-output "$GITHUB_OUTPUT"
      - name: Open or close the deduplicated approval reminder
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.freshness.outputs.result }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/windows-signing-certificate-preflight.yml
        run: node scripts/manage-automation-issue.mjs --kind signing-certificate-preflight-stale --result "$RESULT" --repository "$REPOSITORY" --run-url "$RUN_URL"
