name: Prepare guarded toolchain major promotion

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type CREATE-DRAFT-TOOLCHAIN-PR to prepare a draft PR
        required: true
        type: string

concurrency:
  group: toolchain-major-promotion
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare-draft-pr:
    if: ${{ inputs.confirmation == 'CREATE-DRAFT-TOOLCHAIN-PR' }}
    runs-on: windows-latest
    timeout-minutes: 50
    permissions:
      actions: write
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - name: Check out protected main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
      - name: Verify three consecutive green scheduled canaries and the 4.0.9 release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = gh release view v4.0.9 --repo $env:GITHUB_REPOSITORY --json publishedAt,isDraft,isPrerelease | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'v4.0.9 must be published before preparing the toolchain promotion PR.' }
          if ($release.isDraft -or $release.isPrerelease) { throw 'v4.0.9 must be a published stable release before preparing the toolchain promotion PR.' }
          $publishedAt = [DateTimeOffset]::Parse([string]$release.publishedAt)
          $response = gh api "repos/$env:GITHUB_REPOSITORY/actions/workflows/toolchain-major-canary.yml/runs?event=schedule&status=completed&per_page=10" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not read scheduled toolchain canary history.' }
          $runs = @($response.workflow_runs | Where-Object { $_.head_branch -eq 'main' -and [DateTimeOffset]::Parse([string]$_.created_at) -gt $publishedAt } | Select-Object -First 3)
          if ($runs.Count -lt 3) { throw "Three completed scheduled canaries on main after v4.0.9 are required; found $($runs.Count)." }
          $failures = @($runs | Where-Object { $_.conclusion -ne 'success' })
          if ($failures.Count -gt 0) { throw 'The three most recent scheduled toolchain canaries are not all green.' }
          $evidence = [ordered]@{ schemaVersion = 1; checkedAt = [DateTime]::UtcNow.ToString('o'); requiredRelease = [ordered]@{ tag = 'v4.0.9'; publishedAt = $release.publishedAt }; consecutiveGreenRuns = @($runs | ForEach-Object { [ordered]@{ id = $_.id; conclusion = $_.conclusion; headSha = $_.head_sha; createdAt = $_.created_at; url = $_.html_url } }); eligible = $true }
          New-Item -ItemType Directory -Force artifacts\toolchain-promotion | Out-Null
          [System.IO.File]::WriteAllText('artifacts\toolchain-promotion\eligibility.json', ($evidence | ConvertTo-Json -Depth 6), [System.Text.UTF8Encoding]::new($false))
      - name: Download and validate all canary lane evidence
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $eligibility = Get-Content artifacts\toolchain-promotion\eligibility.json -Raw | ConvertFrom-Json
          $runIds = @($eligibility.consecutiveGreenRuns | ForEach-Object { [long]$_.id })
          $headShas = @($eligibility.consecutiveGreenRuns | ForEach-Object { [string]$_.headSha })
          $artifactEvidence = @()
          $expectedLanes = @('typescript-7', 'node-types-26', 'combined')
          foreach ($runId in $runIds) {
            $destination = "artifacts\toolchain-promotion\canaries\$runId"
            $artifactResponse = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$runId/artifacts?per_page=100" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw "Could not enumerate toolchain evidence artifacts for run $runId." }
            foreach ($lane in $expectedLanes) {
              $name = "toolchain-next-major-$lane-$runId"
              $matches = @($artifactResponse.artifacts | Where-Object { $_.name -eq $name })
              if ($matches.Count -ne 1 -or $matches[0].expired -eq $true -or [string]$matches[0].digest -notmatch '^sha256:[0-9a-f]{64}$') { throw "Run $runId must expose one unexpired $name artifact with a GitHub SHA-256 digest." }
              $artifact = $matches[0]
              $zipPath = Join-Path $destination "$name.zip"
              node .\scripts\download-github-artifact.mjs $env:GITHUB_REPOSITORY $artifact.id $artifact.digest $zipPath
              if ($LASTEXITCODE -ne 0) { throw "Artifact $name did not match its GitHub digest." }
              $laneRoot = Join-Path $destination $name
              Expand-Archive -LiteralPath $zipPath -DestinationPath $laneRoot
              Remove-Item -LiteralPath $zipPath -Force
              $artifactEvidence += [ordered]@{ runId = $runId; lane = $lane; name = $name; artifactId = [long]$artifact.id; digest = [string]$artifact.digest }
            }
          }
          $validation = .\scripts\test-toolchain-promotion-evidence.ps1 -EvidenceRoot artifacts\toolchain-promotion\canaries -RunIdsCsv ($runIds -join ',') -ExpectedHeadShasCsv ($headShas -join ',')
          $validation | Add-Member -NotePropertyName artifacts -NotePropertyValue $artifactEvidence
          [System.IO.File]::WriteAllText('artifacts\toolchain-promotion\canary-evidence.json', ($validation | ConvertTo-Json -Depth 8), [System.Text.UTF8Encoding]::new($false))
      - name: Set up supported release runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Promote the canaried compiler and Node type surface
        shell: powershell
        run: npm install --save-dev --save-exact typescript@7.0.2 '@types/node@26.4.0'
      - name: Restore the weekly canary schedule in the promotion change
        shell: powershell
        run: |
          $workflowPath = '.github\workflows\toolchain-major-canary.yml'
          $source = Get-Content -Raw -LiteralPath $workflowPath
          $updated = $source.Replace("cron: '29 10 * * *'", "cron: '29 10 * * 4'").Replace('# Daily while 4.0.9 gathers its three-run promotion soak; restore weekly after promotion.', '# Weekly after the reviewed next-major toolchain promotion.')
          if ($updated -eq $source) { throw 'The temporary daily toolchain canary schedule was not found.' }
          [System.IO.File]::WriteAllText($workflowPath, $updated, [System.Text.UTF8Encoding]::new($false))
      - name: Run the production quality gates
        shell: powershell
        run: |
          npm run lint
          npm run typecheck
          npm run test
          npm run build
          npm run config:validate
      - name: Attest the exact promotion eligibility and validation evidence
        id: promotion-attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            artifacts/toolchain-promotion/eligibility.json
            artifacts/toolchain-promotion/canary-evidence.json
      - name: Create a dedicated draft pull request
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $branch = "automation/toolchain-major-$env:GITHUB_RUN_ID"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c $branch
          git add package.json package-lock.json .github/workflows/toolchain-major-canary.yml
          git commit -m 'build: promote validated next-major toolchain'
          $headSha = (git rev-parse HEAD).Trim()
          git push --set-upstream origin $branch
          $attestationUrl = '${{ steps.promotion-attestation.outputs.attestation-url }}'
          $body = "Prepared only after the v4.0.9 release and three consecutive successful scheduled toolchain canaries. Full production lint, typecheck, unit tests, build, and configuration validation passed before this draft PR was opened. Protected CI is explicitly dispatched for the promotion commit because GitHub does not recursively trigger workflows from pull requests created with GITHUB_TOKEN.`n`nPromotion evidence attestation: $attestationUrl"
          $prUrl = gh pr create --draft --base main --head $branch --title 'build: promote validated TypeScript 7 and Node 26 types' --body $body
          if ($LASTEXITCODE -ne 0) { throw 'Could not create the guarded draft promotion pull request.' }
          gh workflow run ci.yml --repo $env:GITHUB_REPOSITORY --ref $branch
          if ($LASTEXITCODE -ne 0) { throw 'Could not explicitly dispatch protected CI for the promotion branch.' }
          $deadline = [DateTime]::UtcNow.AddMinutes(3)
          do {
            Start-Sleep -Seconds 5
            $ciRun = @(gh run list --repo $env:GITHUB_REPOSITORY --workflow ci.yml --branch $branch --event workflow_dispatch --json databaseId,headSha,status,conclusion --limit 20 | ConvertFrom-Json | Where-Object { $_.headSha -eq $headSha } | Select-Object -First 1)
          } until ($ciRun.Count -eq 1 -or [DateTime]::UtcNow -ge $deadline)
          if ($ciRun.Count -ne 1) { throw "Protected CI was dispatched, but no run appeared for promotion commit $headSha." }
          gh run watch $ciRun[0].databaseId --repo $env:GITHUB_REPOSITORY --exit-status
          if ($LASTEXITCODE -ne 0) { throw "Protected CI failed for draft promotion PR $prUrl." }
      - name: Retain promotion eligibility evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: toolchain-promotion-${{ github.run_id }}
          path: |
            artifacts/toolchain-promotion/eligibility.json
            artifacts/toolchain-promotion/canary-evidence.json
          if-no-files-found: warn
          retention-days: 30
