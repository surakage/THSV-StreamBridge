name: Portable runtime cache canary

on:
  schedule:
    - cron: '17 10 * * 3'
  workflow_dispatch:

concurrency:
  group: portable-runtime-cache-canary
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh-and-rehearse:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Restore the newest verified cache generation
        uses: actions/cache@v5
        with:
          path: .cache/node-runtime
          key: portable-node-runtime-${{ runner.os }}-22.23.1-canary-${{ github.run_id }}
          restore-keys: |
            portable-node-runtime-${{ runner.os }}-22.23.1-
      - name: Refresh, rotate, validate, and reject corruption
        shell: powershell
        run: .\scripts\rehearse-node-runtime-cache.ps1
      - name: Upload rehearsal evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runtime-cache-canary-${{ github.run_id }}
          path: artifacts/runtime-cache/latest.json
          if-no-files-found: error
          retention-days: 30

  notify-after-repeat-failure:
    needs: refresh-and-rehearse
    if: ${{ always() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - name: Notify only after two consecutive scheduled failures
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RESULT: ${{ needs.refresh-and-rehearse.result }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/manage-automation-issue.mjs --kind runtime-cache-canary --result "$CURRENT_RESULT" --repository "$REPOSITORY" --run-url "$RUN_URL"
