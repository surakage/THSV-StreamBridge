name: Post-release smoke

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to verify
        required: true
        type: string

permissions:
  contents: read
  attestations: read

jobs:
  published-assets:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out the published tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - name: Download, verify, and install published assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        shell: powershell
        run: .\scripts\test-published-release.ps1 -Tag $env:RELEASE_TAG
      - name: Upload post-release evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: post-release-smoke-${{ github.run_id }}
          path: artifacts/published-release/latest.json
          if-no-files-found: error
          retention-days: 30

  notify:
    needs: published-assets
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open one failure issue per tag or close it after recovery
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.published-assets.result }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          title="[automation] Post-release smoke failed for $RELEASE_TAG"
          issue=$(gh issue list --repo "$REPOSITORY" --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [[ "$RESULT" == 'success' ]]; then
            if [[ -n "$issue" ]]; then
              gh issue close "$issue" --repo "$REPOSITORY" --comment "Post-release verification recovered for $RELEASE_TAG: $RUN_URL"
            fi
            exit 0
          fi
          if [[ -n "$issue" ]]; then
            gh issue comment "$issue" --repo "$REPOSITORY" --body "Post-release verification failed again for $RELEASE_TAG: $RUN_URL"
            exit 0
          fi
          gh issue create --repo "$REPOSITORY" --title "$title" --body "Published asset verification, provenance, installation, or rollback protection failed for $RELEASE_TAG. Review the run and its evidence: $RUN_URL"
