name: Post-release smoke

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to verify
        required: true
        type: string

permissions:
  contents: read
  attestations: read

jobs:
  published-assets:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out the current release verification policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
      - name: Download, verify, and install published assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        shell: powershell
        run: .\scripts\test-published-release.ps1 -Tag $env:RELEASE_TAG
      - name: Upload post-release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: post-release-smoke-${{ github.run_id }}
          path: artifacts/published-release/latest.json
          if-no-files-found: error
          retention-days: 30

  notify:
    needs: published-assets
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out the current notification policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
      - name: Open one failure issue per tag or close it after recovery
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.published-assets.result }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/manage-automation-issue.mjs --kind post-release-smoke --result "$RESULT" --tag "$RELEASE_TAG" --repository "$REPOSITORY" --run-url "$RUN_URL"
