version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "10:17"
      timezone: America/Chicago
    open-pull-requests-limit: 1
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "ci"
    groups:
      immutable-action-digests:
        patterns:
          - "*"
