name: Feature request
description: Suggest a new feature, add-on or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do on stream?
      description: Describe what you or your viewers want to happen, in your own words.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How do you picture it working?
      description: Commands, rewards, overlays, which platforms. Rough ideas are fine.
  - type: textarea
    id: today
    attributes:
      label: How do you do it today, if at all?
