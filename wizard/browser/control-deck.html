<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Control Deck · THSV StreamBridge</title><link rel="stylesheet" href="/wizard/control-deck.css"></head>
<body><main class="control-deck">
<header><p class="eyebrow">THSV StreamBridge</p><h1>Control Deck</h1><p class="lead">Control your extensions during the stream. Grey tabs are turned off in Extensions.</p></header>
<section id="login" class="card" aria-labelledby="login-heading">
  <h2 id="login-heading">Unlock</h2>
  <p>Open this page from the Setup Wizard, the tray or Streamer.bot to unlock it automatically, or paste the Wizard password.</p>
  <form id="login-form"><label for="token">Wizard password</label><input id="token" type="password" autocomplete="off" spellcheck="false"><button type="submit">Unlock</button></form>
  <p id="login-error" class="error" role="alert"></p>
</section>
<section id="workspace" class="hidden">
  <nav id="tabs" class="tabs" role="tablist" aria-label="Extensions"></nav>
  <p id="result" class="result" role="status" aria-live="polite"></p>
  <section id="panel" class="panel" role="tabpanel" aria-live="off"></section>
  <p class="footer"><button id="refresh" type="button" class="ghost">Refresh</button></p>
</section>
</main><script src="/wizard/control-deck.js"></script></body></html>
